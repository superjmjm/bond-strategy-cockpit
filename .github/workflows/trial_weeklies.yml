name: Four archived weeklies - isolated schema trial
on:
  push:
    branches: [trial/four-weeklies-schema-20261124]
    paths:
      - 'schemas/extraction_prompt.md'
      - 'schemas/view_extraction.schema.json'
      - 'schemas/data_contract.md'
      - 'pipeline/build_snapshot.py'
      - 'pilot/replay_weeklies.py'
      - 'pilot/round_two.py'
      - 'pilot/round_three.py'
      - 'pilot/evidence_cards.py'
      - '.github/workflows/trial_weeklies.yml'
permissions:
  contents: read
concurrency:
  group: handoff-four-weeklies
  cancel-in-progress: false
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check trial code and input availability
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile pilot/replay_weeklies.py pilot/round_two.py
          for input in schemas/extraction_prompt.md schemas/view_extraction.schema.json schemas/data_contract.md pipeline/build_snapshot.py; do
            if [[ ! -s "$input" ]]; then
              echo 'Awaiting original handoff files. Extraction has not started.'
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          python -m py_compile pipeline/build_snapshot.py
          sha256sum schemas/extraction_prompt.md schemas/view_extraction.schema.json schemas/data_contract.md pipeline/build_snapshot.py
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Install trial dependencies
        if: steps.inputs.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt 'jsonschema>=4.23,<5'
      - name: Read four archived PDFs and build the isolated snapshot
        if: steps.inputs.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python pilot/round_three.py
