name: Update bond cockpit
on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Dispatch origin
        type: choice
        options: [manual, cloudflare, benchmark, publish-only, drive-only]
        default: manual
      history_backfill:
        description: Search the last eight weeks for unpublished reports
        type: boolean
        default: false
      report_id:
        description: Optional NXNY report ID for single-report validation
        type: string
      reviewed_extraction:
        description: Optional reviewed JSON for a report already archived in Drive
        type: string
  push:
    branches: [main]
    paths: [index.html, dashboard_data.json, anchored_reports.json, 'web/**', 'zip_a/**', 'scripts/check_zip_a.py', 'scripts/build_zip_a.py', 'scripts/build_public.py', 'scripts/anchored_snapshot.py', .github/workflows/update_dashboard.yml]
  schedule:
    - cron: '17 0 * * *' # 北京时间 08:17
    - cron: '17 4 * * *' # 北京时间 12:17
    - cron: '17 9 * * *' # 北京时间 17:17
    - cron: '37 13 * * 1-5' # 工作日北京时间 21:37，国债曲线
permissions: {}
concurrency:
  group: bond-cockpit-update
  cancel-in-progress: false

jobs:
  update:
    if: >-
      (vars.ENABLE_REPORT_PIPELINE == 'true' || inputs.trigger_source == 'drive-only' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[drive-only-intake]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.trigger_source == 'manual' &&
      inputs.report_id != '' && inputs.reviewed_extraction != '')) &&
      (github.event_name != 'push' || contains(github.event.head_commit.message, '[backfill-weeklies]') ||
      contains(github.event.head_commit.message, '[drive-only-intake]')) && github.ref_name == github.event.repository.default_branch &&
      (inputs.reviewed_extraction == '' || (github.event_name == 'workflow_dispatch' &&
      inputs.trigger_source == 'manual' && inputs.report_id != '')) &&
      inputs.trigger_source != 'benchmark' && inputs.trigger_source != 'publish-only' &&
      (github.event_name != 'schedule' || (vars.SCHEDULER == 'github' &&
      github.event.schedule != '37 13 * * 1-5')) &&
      (inputs.trigger_source != 'cloudflare' || (vars.SCHEDULER == 'cloudflare' && !inputs.report_id))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
      NXNY_REPORT_ID: ${{ inputs.report_id }}
      DRIVE_ONLY: ${{ inputs.trigger_source == 'drive-only' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[drive-only-intake]')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check configuration before downloading
        env:
          MODEL_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRIVE: ${{ secrets.GDRIVE_OAUTH_JSON }}
          FOLDER: ${{ vars.GDRIVE_FOLDER_ID }}
          BROWSER_KEY: ${{ secrets.TINYFISH_API_KEY }}
          PROFILE: ${{ secrets.TINYFISH_PROFILE_ID }}
          HAS_REVIEWED_EXTRACTION: ${{ inputs.reviewed_extraction != '' }}
        run: |
          keys=(DRIVE FOLDER)
          if [[ "$HAS_REVIEWED_EXTRACTION" != "true" ]]; then keys+=(MODEL_KEY); fi
          if [[ "$HAS_REVIEWED_EXTRACTION" != "true" && "$DRIVE_ONLY" != "true" ]]; then keys+=(BROWSER_KEY PROFILE); fi
          for key in "${keys[@]}"; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing configuration $key"; exit 1; fi
          done

      # Step 1 拉取最新研报。可把此步骤替换为现有采集脚本，PDF 放入 reports_inbox/。
      - name: Recover unpublished archives or collect NXNY reports
        id: fetch
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          TINYFISH_PROFILE_ID: ${{ secrets.TINYFISH_PROFILE_ID }}
          REPORT_LOOKBACK_DAYS: ${{ (inputs.history_backfill || contains(github.event.head_commit.message, '[backfill-weeklies]')) && '56' || '7' }}
          MAX_NEW_PDFS: ${{ (inputs.history_backfill || contains(github.event.head_commit.message, '[backfill-weeklies]')) && '10' || vars.MAX_NEW_PDFS || '15' }}
          HAS_REVIEWED_EXTRACTION: ${{ inputs.reviewed_extraction != '' }}
        run: |
          rc=0
          args=()
          if [[ "$DRIVE_ONLY" == "true" ]]; then
            args+=(--drive-only)
          elif [[ "$HAS_REVIEWED_EXTRACTION" == "true" ]]; then
            args+=(--archive-only)
          fi
          python scripts/report_io.py fetch "${args[@]}" || rc=$?
          echo "code=$rc" >> "$GITHUB_OUTPUT"
          if [[ $rc != 0 && $rc != 2 ]]; then exit "$rc"; fi

      # Step 2 按文件摘要备份 PDF，回读上传回执的 MD5 后才继续。此处可换为既有备份脚本。
      - name: Back up PDFs to Google Drive
        if: env.DRIVE_ONLY != 'true' && inputs.reviewed_extraction == ''
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
        run: python scripts/report_io.py backup

      - name: Extract PDF and merge history
        id: extract
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEWED_REPORT_JSON: ${{ inputs.reviewed_extraction }}
        run: |
          rc=0
          if [[ -n "$REVIEWED_REPORT_JSON" ]]; then
            python scripts/extract_bond_reports.py || rc=$?
          else
            python scripts/anchored_batch.py || rc=$?
          fi
          echo "code=$rc" >> "$GITHUB_OUTPUT"
          if [[ $rc != 0 && $rc != 2 ]]; then exit "$rc"; fi
      - name: Continue historical batches after checkpointing verified results
        id: backfill
        if: env.DRIVE_ONLY != 'true' && (inputs.history_backfill || contains(github.event.head_commit.message, '[backfill-weeklies]')) && steps.fetch.outputs.code == '0' && steps.extract.outputs.code == '0'
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          TINYFISH_PROFILE_ID: ${{ secrets.TINYFISH_PROFILE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_NEW_PDFS: '10'
          REPORT_LOOKBACK_DAYS: '56'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for batch in {1..5}; do
            if ! git diff --quiet -- anchored_reports.json ignored_nxny_ids.json; then
              if ! git diff --quiet -- anchored_reports.json; then
                python scripts/build_public.py "$RUNNER_TEMP/backfill-proof" --production
              fi
              git commit -m 'Checkpoint weekly report intake' -- anchored_reports.json ignored_nxny_ids.json
              git push origin "HEAD:refs/heads/$BRANCH"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
            find reports_inbox -maxdepth 1 -type f -name '*.pdf' -delete
            fetch_rc=0
            extract_rc=0
            python scripts/report_io.py fetch || fetch_rc=$?
            if [[ "$fetch_rc" != 0 && "$fetch_rc" != 2 ]]; then exit "$fetch_rc"; fi
            if compgen -G 'reports_inbox/*.pdf' >/dev/null; then
              python scripts/report_io.py backup
              python scripts/anchored_batch.py || extract_rc=$?
              if [[ "$extract_rc" != 0 && "$extract_rc" != 2 ]]; then exit "$extract_rc"; fi
            elif [[ "$fetch_rc" == 0 ]] && git diff --quiet -- ignored_nxny_ids.json; then
              exit 0
            fi
            if [[ "$fetch_rc" == 2 || "$extract_rc" == 2 ]]; then
              echo "code=2" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::notice::Batch safety limit reached; check remaining eligible reports."
      - name: Verify the selected report and PDF page references
        if: inputs.reviewed_extraction != ''
        run: python scripts/verify_selected_report.py
      - name: Verify new report references before publication
        if: env.NXNY_REPORT_ID == ''
        run: |
          if git diff --quiet -- dashboard_data.json; then echo "No new report data"; exit 0; fi
          git show HEAD:dashboard_data.json > "$RUNNER_TEMP/dashboard-before.json"
          python scripts/verify_selected_report.py --previous "$RUNNER_TEMP/dashboard-before.json"
      - name: Verify the Drive batch can build the public A snapshot
        if: env.DRIVE_ONLY == 'true'
        run: python scripts/build_public.py "$RUNNER_TEMP/drive-proof" --production
      - name: Commit only changed dashboard data and ignore state
        id: commit
        run: |
          set -euo pipefail
          git add -- dashboard_data.json anchored_reports.json ignored_nxny_ids.json
          if git diff --cached --quiet; then
            if [[ "${{ steps.backfill.outputs.changed }}" == 'true' ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
            echo "Dashboard and ignore state unchanged since the last checkpoint"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update bond strategy dashboard' -- dashboard_data.json anchored_reports.json
          git fetch origin "$BRANCH"
          if ! git diff --quiet HEAD^ FETCH_HEAD -- dashboard_data.json anchored_reports.json ignored_nxny_ids.json; then
            echo "::error::Upstream data changed during extraction. Run again to merge from the latest snapshot."
            exit 1
          fi
          git rebase FETCH_HEAD
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Report incomplete batch after publishing successes
        if: steps.fetch.outputs.code == '2' || steps.extract.outputs.code == '2' || steps.backfill.outputs.code == '2'
        run: |
          echo "::error::Partial batch. Successful records are committed. Failed PDFs can be retried."
          exit 1

  benchmark:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      ((github.event_name == 'schedule' && vars.SCHEDULER != 'cloudflare' && github.event.schedule == '37 13 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.trigger_source == 'benchmark'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read and validate the official daily curve
        run: python scripts/update_benchmark.py
      - name: Commit only a changed complete curve
        id: commit
        run: |
          set -euo pipefail
          git add -- dashboard_data.json
          if git diff --cached --quiet; then echo "Official curve unchanged"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh the official Treasury yield benchmark' -- dashboard_data.json
          git fetch origin "$BRANCH"
          if ! git diff --quiet HEAD^ FETCH_HEAD -- dashboard_data.json; then
            echo "::error::Upstream dashboard changed during curve collection. Retry the benchmark from the latest data."
            exit 1
          fi
          git rebase FETCH_HEAD
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  first-production:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && contains(github.event.head_commit.message, '[anchored-launch]')
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s pilot/anchored
      - name: Read first production batch from verified archives
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/anchored_batch.py --archive-id 6537477 --archive-id 6536545
          python scripts/build_public.py "$RUNNER_TEMP/proof" --production
          git add -- anchored_reports.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish first anchored production batch'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

  pages-package:
    needs: [update, benchmark, first-production]
    if: >-
      always() && !cancelled() && needs.first-production.result != 'failure' && vars.DEPLOY_GITHUB_PAGES == 'true' &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'push' || needs.update.outputs.changed == 'true' ||
      needs.benchmark.outputs.changed == 'true' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.trigger_source == 'publish-only' || needs.update.result == 'success')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Stage only public files
        id: package
        run: |
          mkdir -p "$RUNNER_TEMP/bond-public"
          python scripts/build_public.py "$RUNNER_TEMP/bond-public" --production
          echo "artifact_name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/bond-public
          retention-days: 1

  pages:
    needs: pages-package
    if: always() && !cancelled() && needs.pages-package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Wait for the uploaded Pages artifact
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.pages-package.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.pages-package.outputs.artifact_name }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ || -z "$ARTIFACT_NAME" ]]; then
            echo '::error::The Pages upload did not return an artifact ID and name.'
            exit 1
          fi
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 5 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" | \
              jq -e --argjson id "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" \
                'any(.artifacts[]; .id == $id and .name == $name and .expired == false)' > /dev/null; then
              echo "Pages artifact $ARTIFACT_NAME ($ARTIFACT_ID) is visible."
              exit 0
            fi
            if (( attempt < 12 )); then sleep 5; fi
          done
          echo "::error::Pages artifact $ARTIFACT_NAME ($ARTIFACT_ID) did not become visible."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: ${{ needs.pages-package.outputs.artifact_name }}

  verify-online:
    needs: pages
    if: always() && !cancelled() && needs.pages.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install 'playwright>=1.55,<2'
      - run: python scripts/check_zip_a.py https://superjmjm.github.io/bond-strategy-cockpit/
      - run: python scripts/check_zip_a.py https://superjmjm.github.io/bond-strategy-cockpit/preview-a/
