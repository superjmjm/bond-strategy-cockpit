name: Verify NXNY public listing pagination
on:
  push:
    branches: ['fix/paginate-nxny-discovery']
    paths: ['.github/workflows/verify_nxny_pagination_once.yml']
permissions:
  contents: read
jobs:
  read-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32.5,<3'
      - name: Check multiple pages without downloading a PDF
        run: |
          python - <<'PY'
          from datetime import datetime
          from unittest.mock import patch
          from scripts import report_io as io
          today = datetime.now(io.CN).date()
          urls = []
          real_get = io.requests.get
          def record(url, **kwargs):
              urls.append(url)
              return real_get(url, **kwargs)
          with patch.object(io.requests, "get", side_effect=record):
              reports, pages, issue = io.scan_listing(today, set(), set(), 10)
          print(f"Directory pages fetched={pages}; eligible unique candidates={len(reports)}")
          assert not issue, issue
          assert 2 <= pages <= io.MAX_LIST_PAGES
          assert urls[:2] == [io.LIST_URL, "https://www.nxny.com/stype_qh_p2/"]
          assert len({rid for rid, _ in reports}) == len(reports) <= 10
          print("Verified that the production scanner traverses the actual public listing with no PDF downloads.")
          PY
