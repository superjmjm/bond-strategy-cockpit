name: Fixed-slot reader regression on the same 18 reports
on:
  push:
    branches: [trial/anchored-fixed-slots-18]
    paths: ['.github/workflows/anchored-regression18.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    outputs:
      receipt: ${{ steps.input.outputs.receipt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r pilot/requirements-unified.txt google-api-python-client requests
      - run: python -m unittest discover -s pilot/anchored
      - id: input
        name: Create private input receipt alongside V7
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          PYTHONPATH: .:pilot/anchored
        run: |
          python - <<'PY'
          import os
          from trial import drive_service, private_parent, private_file
          drive=drive_service()
          fid=private_file(drive,private_parent(drive),"regression18-"+os.environ["GITHUB_RUN_ID"]+"-input.json.gz","application/gzip")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              print("receipt="+fid,file=f)
          print("Private input ID",fid)
          PY
  regression:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r pilot/requirements-unified.txt google-api-python-client requests
      - name: Run 18 known reports, replay from cache, save private receipts
        env:
          PYTHONPATH: .
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          REGRESSION_INPUT_ID: ${{ needs.prepare.outputs.receipt }}
          INDEX_SHA256: 2e4717f229aeeafe2f14ff576226cfa45bb86222cb0c63e1a2c136e083c43fe9
        run: python pilot/anchored/trial.py
