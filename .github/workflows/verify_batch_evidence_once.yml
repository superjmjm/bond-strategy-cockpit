name: Verify batch evidence using an archived PDF
on:
  push:
    branches: ['fix/verify-evidence-before-batch-publish']
    paths: ['.github/workflows/verify_batch_evidence_once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NXNY_REPORT_ID: '6536940'
      SOURCE_SHA: 'd4387fffa15bd296d8c5a88c67648c03a96096a97d1ae28a5ec377c68041348b'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Use a runner-local previous dataset for replay
        run: |
          cp dashboard_data.json "$RUNNER_TEMP/dashboard-live.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("dashboard_data.json")
          data = json.loads(path.read_text())
          assert sum(r["report_id"] == os.environ["SOURCE_SHA"] for r in data["records"]) == 5
          data["records"] = [r for r in data["records"] if r["report_id"] != os.environ["SOURCE_SHA"]]
          path.write_text(json.dumps(data, ensure_ascii=False))
          PY
          cp dashboard_data.json "$RUNNER_TEMP/dashboard-before.json"
      - name: Restore the original from the private archive
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
        run: python scripts/report_io.py fetch --archive-only
      - name: Accept good evidence and reject an incorrect page
        run: |
          cp "$RUNNER_TEMP/dashboard-live.json" dashboard_data.json
          python scripts/verify_selected_report.py --previous "$RUNNER_TEMP/dashboard-before.json"
          python scripts/verify_selected_report.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("dashboard_data.json")
          data = json.loads(path.read_text())
          for row in data["records"]:
              if row["report_id"] == os.environ["SOURCE_SHA"] and row["tenor"] == "10Y":
                  row["evidence_page"] = 0
          path.write_text(json.dumps(data, ensure_ascii=False))
          PY
          if python scripts/verify_selected_report.py --previous "$RUNNER_TEMP/dashboard-before.json"; then
            echo "Incorrect evidence unexpectedly passed"
            exit 1
          fi
          echo "Expected rejection confirmed without touching the published dataset."
