name: Compare Sol medium on frozen 18-report regression
on:
  push:
    branches: [trial/run-anchored-domain-seen18-20261125]
    paths: ['.github/workflows/anchored18.yml']
permissions:
  contents: read
jobs:
  regression:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1c138058f3521f256f61e832cffadef5a6b37cf9
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r pilot/requirements-unified.txt google-api-python-client requests
      - run: python -m unittest discover -s pilot/anchored
      - name: Check model availability for the project
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          from openai import OpenAI, APIStatusError
          try:
              with OpenAI() as client:
                  print("Available:",client.models.retrieve("gpt-6.2-sol").id)
          except APIStatusError as exc:
              print("Model preflight",exc.status_code,exc.code)
              raise SystemExit(1)
          PY
      - name: Read same verified index, replay and write private receipts
        env:
          PYTHONPATH: .
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          REGRESSION_INPUT_ID: 1_IovBKul7tUYp6dXYMzUjDzrsv3Kkq7U
          INDEX_SHA256: 2e4717f229aeeafe2f14ff576226cfa45bb86222cb0c63e1a2c136e083c43fe9
        run: python pilot/anchored/trial.py
