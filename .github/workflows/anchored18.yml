name: Blind validation on 18 unseen archived reports
on:
  push:
    branches: [trial/run-anchored-domain-unseen18-20261125]
    paths: ['.github/workflows/anchored18.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    outputs:
      receipt: ${{ steps.input.outputs.receipt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1c138058f3521f256f61e832cffadef5a6b37cf9
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r pilot/requirements-unified.txt google-api-python-client requests
      - name: Allocate a private input receipt
        id: input
        env:
          PYTHONPATH: .:pilot/anchored
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: |
          python - <<'PY'
          import os
          from trial import drive_service, private_parent, private_file
          drive = drive_service()
          fid = private_file(drive, private_parent(drive), "blind-input-" + os.environ["GITHUB_RUN_ID"] + ".json.gz", "application/gzip")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("receipt=" + fid, file=out)
          print("Private input ID", fid)
          PY
  blind:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1c138058f3521f256f61e832cffadef5a6b37cf9
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r pilot/requirements-unified.txt google-api-python-client requests
      - run: python -m unittest discover -s pilot/anchored
      - name: Read each unseen report twice and verify its cached replay
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          PYTHONPATH: .:pilot/anchored
          REGRESSION_INPUT_ID: ${{ needs.prepare.outputs.receipt }}
          INDEX_SHA256: e75269143e0289792459d9a49f45ebae401bc3018762397545f325b02598c20c
        run: |
          python - <<'PY'
          import os, tempfile
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from trial import drive_service, private_parent, sealed_indices, process, save, digest
          run = os.environ["GITHUB_RUN_ID"]
          drive = drive_service()
          parent = private_parent(drive)
          data = sealed_indices(drive, parent, run)
          assert len(data) == len({ix["report_id"] for m, ix in data}) == 18
          manifest = dict(reader_commit="1c138058f3521f256f61e832cffadef5a6b37cf9", reference_sha256="b0fa55cc880a9ca4ae932cf301db1327b9847b8fc7243519778f1373bcd95a36", input_sha256=os.environ["INDEX_SHA256"], reports=[])
          with tempfile.TemporaryDirectory() as td, ThreadPoolExecutor(max_workers=3) as pool:
              jobs = {}
              for i,(m,ix) in enumerate(data, 1):
                  assert m["report_id"] == ix["report_id"]
                  meta = {k:m[k] for k in ("broker","title","series","report_date")}
                  jobs[pool.submit(process,ix,meta,Path(td))] = i
              for future in as_completed(jobs):
                  i = jobs[future]
                  result = future.result()
                  rec = dict(index=i, output=result["output"], candidates=result["s1"]["candidates"], review=result["s2"], receipts=result["receipts"], replay_identical=True)
                  rid = save(drive,parent,f"blind-{run}-{i:02}.json",rec)
                  manifest["reports"].append(dict(index=i,receipt_id=rid,sha256=digest(rec),replay_identical=True))
                  print("Saved",i,flush=True)
          manifest["reports"].sort(key=lambda row:row["index"])
          print("Manifest",save(drive,parent,"blind-"+run+"-manifest.json",manifest),flush=True)
          PY
