name: Anchored two-pass sealed 18-report trial
on:
  push:
    branches: [trial/anchored-18-20261125]
    paths: ['.github/workflows/anchored18.yml']
permissions:
  contents: read
jobs:
  sealed-trial:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8afe2c761fbbb12201331cee060502654edfddbd
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r pilot/requirements-unified.txt google-api-python-client requests
      - run: python -m unittest discover -s pilot/anchored
      - name: Verify originals and private destination, read once, replay offline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          PYTHONPATH: .
        run: python pilot/anchored/trial.py
