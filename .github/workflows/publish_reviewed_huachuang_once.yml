name: Verify the deployed Huachuang quote dialogs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish_reviewed_huachuang_once.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install chromium
      - name: Read the deployed dataset and open both evidence dialogs
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen
          from playwright.sync_api import expect, sync_playwright

          url = "https://superjmjm.github.io/bond-strategy-cockpit/"
          with urlopen(url + "dashboard_data.json?v=ddfaf97", timeout=30) as response:
              data = json.load(response)
          live = [row for row in data["records"] if not row["is_demo"]]
          assert not data["demo_mode"] and len(live) == 5
          assert {row["broker"] for row in live} == {"华创证券"}
          assert {row["report_id"] for row in live} == {"d4387fffa15bd296d8c5a88c67648c03a96096a97d1ae28a5ec377c68041348b"}
          views = {row["tenor"]: row for row in live}
          assert views["10Y"]["target_range"] == [1.55, 1.60]
          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              page = browser.new_page()
              page.goto(url + "?v=ddfaf97-ui", wait_until="domcontentloaded", timeout=30000)
              expect(page.get_by_text("研报数据", exact=True)).to_be_visible(timeout=20000)
              for tenor, physical_page in [("10Y", 1), ("curve", 10)]:
                  page.locator(f'tr[data-tenor="{tenor}"] button.open-tenor').first.click()
                  drawer = page.locator("#drawer")
                  expect(drawer).to_be_visible()
                  drawer.get_by_role("button", name="查看原文证据", exact=True).click()
                  modal = page.locator("#evidence")
                  expect(modal).to_be_visible()
                  expect(modal.locator("#sourceMeta")).to_contain_text("华创证券研究")
                  expect(modal.locator("#sourceMeta")).to_contain_text(f"PDF 第 {physical_page} 页")
                  expect(modal.locator("#quote")).to_have_text(views[tenor]["evidence_quote"])
                  modal.get_by_role("button", name="关闭原文", exact=True).click()
                  drawer.locator('button[data-close="drawer"]').click()
                  print(f"{tenor} short quotation dialog verified at PDF page {physical_page}")
              browser.close()
          PY
