<script>
"use strict";
const $ = id => document.getElementById(id);
const TENORS = {"1-3Y":"短端 (1–3Y)","5-7Y":"中端 (5–7Y)","10Y":"长端 (10Y)","30Y":"超长端 (30Y)",curve:"曲线结构"};
const BENCHMARK_TENORS = {"1-3Y":"2Y","5-7Y":"7Y","10Y":"10Y","30Y":"30Y"};
const BENCHMARK_ORIGIN = "https://yield.chinabond.com.cn";
const FACTORS = {liquidity:"资金与央行",macro:"基本面政策",supply:"供需与发行",institution:"机构与情绪"};
const STANCES = {bullish:"偏多",neutral:"中性",cautious:"谨慎",bearish:"偏空",unstated:"未表态"};
const DELTAS = {upgrade:"上调",downgrade:"下调",unchanged:"持平",new:"首次表态",unstated:"未表态"};
const shifts = d => d === "upgrade" || d === "downgrade";
const validRange = v => Array.isArray(v) && v.length === 2 && v.every(Number.isFinite) && v[0] <= v[1];
const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rangeText = r => validRange(r.target_range) ? r.target_range.map(v=>v.toFixed(2)).join("–")+"%" : "";
const key = (r) => JSON.stringify([r.broker,r.tenor]);
const eventKey = r => JSON.stringify([r.report_id,r.broker,r.date,r.tenor]);
let data, universe=[], latest=[], alerts=[], monday="", asOf="", selectedTenor="", high=false, changed=false;
const inWeek = date => date >= monday && date <= asOf;
function passes(r){
  const style = (!r.is_demo && data.broker_styles?.[r.broker]) || r.style;
  return !(high && style==="常年偏多" && r.stance==="bullish" && r.stance_delta==="unchanged") &&
    (!changed || (shifts(r.stance_delta) && inWeek(r.date)));
}
function chooseWeek(){
  asOf=data.demo_mode ? data.updated_at.slice(0,10) : new Date(Date.now()+8*3600000).toISOString().slice(0,10);
  const d=new Date(asOf+"T00:00:00Z");
  d.setUTCDate(d.getUTCDate() - (d.getUTCDay()+6)%7);
  monday=d.toISOString().slice(0,10);
}
function init(payload){
  if(!payload || !Array.isArray(payload.records) || !Array.isArray(payload.radar_alerts) ||
     !payload.benchmark_yields || !Number.isFinite(Date.parse(payload.updated_at))) throw Error("看板数据格式错误");
  for(const r of payload.records){
    if(!Object.hasOwn(TENORS,r.tenor) || !Object.hasOwn(STANCES,r.stance) || !Object.hasOwn(DELTAS,r.stance_delta) ||
       typeof r.broker!=="string" || !/^\d{4}-\d{2}-\d{2}$/.test(r.date) ||
       !Array.isArray(r.drivers) || r.drivers.some(d=>!Object.hasOwn(FACTORS,d.factor) || !["bullish","bearish","neutral"].includes(d.direction))) throw Error("研报记录格式错误");
  }
  data=payload;
  universe=data.records.filter(r=>!!r.is_demo===!!data.demo_mode)
    .sort((a,b)=>b.date.localeCompare(a.date) || String(b.report_id).localeCompare(String(a.report_id),"en"));
  const first=new Map();
  for(const r of universe) if(!first.has(key(r))) first.set(key(r),r);
  latest=[...first.values()];
  const lookup=new Map(universe.map(r=>[eventKey(r),r]));
  alerts=data.radar_alerts.map(a=>lookup.get(eventKey(a))).filter(r=>r && shifts(r.stance_delta));
}
function renderRadar(){
  const rows=alerts.filter(r=>inWeek(r.date) && passes(r));
  $("week").textContent=(data.demo_mode?"示例周 ":"北京时间 ")+monday+" 至 "+asOf;
  $("radarStrip").innerHTML=rows.map(r=>{
    const up=r.stance_delta==="upgrade";
    return '<button class="chip '+(up?'up':'down')+'" data-alert="'+universe.indexOf(r)+'"><header><b>'+esc(r.broker)+'</b><small>'+esc(TENORS[r.tenor])+'</small><em class="'+(up?'upText':'downText')+'">'+(up?'↑ 上调':'↓ 下调')+'</em></header><small>'+esc(STANCES[r.prev_stance])+' → '+esc(STANCES[r.stance])+'</small><p>'+esc(r.marginal_change)+'</p></button>';
  }).join("") || '<small>本周暂无符合筛选条件的上调或下调。</small>';
}
function renderChart(records){
  const terms=Object.keys(TENORS).slice(0,4), values=terms.map(t=>data.benchmark_yields[t]);
  const hasOfficialCurve=typeof data.benchmark_as_of==="string" && /^\d{4}-\d{2}-\d{2}$/.test(data.benchmark_as_of);
  const chartTenors=terms.map(t=>hasOfficialCurve && BENCHMARK_TENORS[t]!==t?t+"（"+BENCHMARK_TENORS[t]+"）":t);
  const bands=terms.map(t=>{
    const ranges=records.filter(r=>r.tenor===t && r.stance!=="unstated" && validRange(r.target_range)).map(r=>r.target_range);
    return ranges.length ? [Math.min(...ranges.map(r=>r[0])),Math.max(...ranges.map(r=>r[1]))] : null;
  });
  const all=[...values,...bands.flatMap(v=>v||[])].filter(Number.isFinite);
  if(!all.length){$("yieldChart").innerHTML="";$("chartNote").textContent="暂无有效基准或目标点位。";return;}
  const min=Math.min(...all), max=Math.max(...all), pad=Math.max(.025,(max-min)*.13);
  const lo=min-pad, hi=max+pad, x=i=>66+165*i, y=v=>180-(v-lo)/(hi-lo)*155;
  let svg='<g fill="#627185" font-family="sans-serif" font-size="12">';
  for(let i=0;i<5;i++){
    const v=lo+(hi-lo)*i/4;
    svg+='<path d="M48 '+y(v)+' H582" stroke="#dce4ee"/><text x="41" y="'+(y(v)+4)+'" text-anchor="end">'+v.toFixed(2)+'</text>';
  }
  for(let i=0;i<4;i++){
    const b=bands[i], c=bands[i+1];
    if(b && c) svg+='<polygon points="'+[[x(i),y(b[0])],[x(i),y(b[1])],[x(i+1),y(c[1])],[x(i+1),y(c[0])]].map(p=>p.join(",")).join(" ")+'" fill="#bfd9f5" opacity=".8"/>';
  }
  for(let i=0;i<4;i++){
    const v=values[i], b=bands[i], t=terms[i];
    if(b) svg+='<path d="M'+x(i)+' '+y(b[0])+' V'+y(b[1])+' m-5 0 h10 M'+(x(i)-5)+' '+y(b[0])+' h10" fill="none" stroke="#8aafd5" stroke-width="2"/>';
    if(i && Number.isFinite(values[i-1]) && Number.isFinite(v)) svg+='<path d="M'+x(i-1)+' '+y(values[i-1])+' L'+x(i)+' '+y(v)+'" fill="none" stroke="#295fa8" stroke-width="2.5"/>';
    if(Number.isFinite(v)) svg+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4" fill="#295fa8"/><text x="'+x(i)+'" y="'+(y(v)-9)+'" text-anchor="middle" fill="#244d7e">'+v.toFixed(2)+'</text>';
    svg+='<text x="'+x(i)+'" y="205" text-anchor="middle">'+chartTenors[i]+'</text>';
  }
  for(let i=0;i<4;i++) svg+='<rect data-tenor="'+terms[i]+'" tabindex="0" role="button" aria-label="'+terms[i]+'券商明细" x="'+(x(i)-38)+'" y="2" width="76" height="211" fill="transparent" cursor="pointer"><title>'+chartTenors[i]+' · 曲线基准 '+(Number.isFinite(values[i])?values[i].toFixed(2)+"%":"缺失")+' · 目标 '+(bands[i]?bands[i].map(v=>v.toFixed(2)).join("–")+"%":"未给区间")+'</title></rect>';
  $("yieldChart").innerHTML=svg+'</g>';
  const note=$("chartNote");
  note.replaceChildren();
  const source=document.createElement(hasOfficialCurve && typeof data.benchmark_source_url==="string" &&
    data.benchmark_source_url.startsWith(BENCHMARK_ORIGIN+"/")?"a":"span");
  if(source.tagName==="A"){
    source.href=data.benchmark_source_url; source.target="_blank"; source.rel="noopener noreferrer";
  }
  source.textContent=data.benchmark_note || "手工维护基准";
  note.append(source);
  if(hasOfficialCurve) note.append(" · 数据日期 "+data.benchmark_as_of);
  note.append(" · 单位 %。色带取各家目标下沿最低值至上沿最高值。");
}
function renderHeat(records){
  $("heatmap").innerHTML='<table class="heat"><thead><tr><th>期限</th>'+Object.values(FACTORS).map(f=>'<th>'+f+'</th>').join("")+'</tr></thead><tbody>'+
    Object.keys(TENORS).map(t=>'<tr data-tenor="'+t+'"><td><button class="open-tenor">'+(t==="curve"?"曲线":t)+'</button></td>'+Object.keys(FACTORS).map(f=>{
      const ds=records.filter(r=>r.tenor===t && r.stance!=="unstated").flatMap(r=>r.drivers.filter(d=>d.factor===f));
      const net=ds.reduce((s,d)=>s+(d.direction==="bullish"?1:d.direction==="bearish"?-1:0),0);
      const cls=!ds.length?"absent":net>0?"pos":net<0?"neg":"flat";
      return '<td><span class="'+cls+'">'+(!ds.length?"—":(net>0?"+":"")+net)+'</span></td>';
    }).join("")+'</tr>').join("")+'</tbody></table>';
}
function renderMatrix(records){
  $("matrixBody").innerHTML=Object.keys(TENORS).map(t=>{
    const list=records.filter(r=>r.tenor===t && r.stance!=="unstated");
    const n=list.length, counts=[0,0,0], tags=new Map();
    for(const r of list){
      counts[r.stance==="bullish"?0:r.stance==="neutral"?1:2]++;
      for(const d of r.drivers){
        const tag=FACTORS[d.factor]+({bullish:"+",bearish:"−",neutral:"·"}[d.direction]);
        tags.set(tag,(tags.get(tag)||0)+1);
      }
    }
    const top=list.find(r=>shifts(r.stance_delta) && inWeek(r.date));
    const action=list.find(r=>r.action && r.action!=="未明确提及") || list[0];
    return '<tr data-tenor="'+t+'"><td><button class="open-tenor">'+TENORS[t]+'</button><br><small>'+(Number.isFinite(data.benchmark_yields[t])?data.benchmark_yields[t].toFixed(2)+'%': (t==='curve'?'相对价值':'—'))+'</small></td><td><div class="counts"><span class="upText">'+counts[0]+'多</span> / '+counts[1]+'中 / <span class="downText">'+counts[2]+'慎空</span></div><div class="meter">'+counts.map(v=>'<i style="width:'+(n?100*v/n:0)+'%"></i>').join("")+'</div><small>已表态 '+n+' 家</small></td><td>'+([...tags].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([tag])=>'<span class="tag">'+esc(tag)+'</span>').join("")||'—')+'</td><td>'+(top?esc(top.broker)+' · '+esc(top.marginal_change):'—')+'</td><td>'+(action?esc(action.broker)+' · '+esc(action.action)+' '+esc(rangeText(action)):'—')+'</td></tr>';
  }).join("");
}
function renderDrawer(records){
  $("drawerTitle").textContent=TENORS[selectedTenor]+" · 卖方观点明细";
  const rows=records.filter(r=>r.tenor===selectedTenor).sort((a,b)=>Number(a.stance==="unstated")-Number(b.stance==="unstated") || Number(shifts(b.stance_delta))-Number(shifts(a.stance_delta)));
  $("drawerBody").innerHTML=rows.map(r=>{
    const muted=r.stance==="unstated";
    return '<article class="detail '+(muted?'muted':'')+'" id="r'+universe.indexOf(r)+'"><div class="row between"><h3>'+esc(r.broker)+'</h3><span class="badge">'+STANCES[r.stance]+' · '+DELTAS[r.stance_delta]+'</span></div><small>'+esc(r.date)+' · '+esc(r.report_title)+'</small><p>边际变化　'+esc(r.marginal_change)+'</p><p>交投建议　'+esc(r.action)+' '+esc(rangeText(r))+'</p><p>失效条件　'+esc(r.falsification)+'</p>'+r.drivers.map(d=>'<p class="sub">'+FACTORS[d.factor]+' · '+esc(d.note)+'</p>').join("")+(r.evidence_quote?'<button class="evidenceBtn" data-source="'+universe.indexOf(r)+'">查看原文证据</button>':'<small>无明确原文证据</small>')+'</article>';
  }).join("") || '<p class="sub">当前筛选条件下，该期限没有记录。</p>';
}
function render(){
  chooseWeek();
  const records=latest.filter(passes);
  document.querySelectorAll("[data-filter]").forEach(e=>{e.checked=e.dataset.filter==="high"?high:changed;});
  renderRadar(); renderChart(records); renderHeat(records); renderMatrix(records);
  if(selectedTenor) renderDrawer(records);
}
function openDrawer(t){
  selectedTenor=t; renderDrawer(latest.filter(passes)); if(!$("drawer").open) $("drawer").showModal();
  $("drawerBody").scrollTop=0;
}
function source(r){
  $("sourceKind").textContent=r.is_demo?"模拟引文 · 示例研报":"原文溯源";
  $("sourceTitle").textContent=r.report_title;
  const sourceBroker = r.is_demo ? r.broker : r.broker + "研究";
  $("sourceMeta").textContent=[sourceBroker,r.date,r.source_file,r.evidence_page?"PDF 第 "+r.evidence_page+" 页":"页码未记录"].filter(Boolean).join(" · ");
  $("quote").textContent=r.evidence_quote || "无明确原文证据"; $("evidence").showModal();
}
for(const id of ["filters","drawerFilters"]){
  $(id).innerHTML='<label class="switch" title="过滤风格标为常年偏多且本期维持偏多的记录"><input data-filter="high" type="checkbox" disabled> 高信噪比模式</label> <label class="switch"><input data-filter="changed" type="checkbox" disabled> 仅看本周改口</label>';
}
document.addEventListener("change",e=>{
  if(!e.target.matches("[data-filter]")) return;
  if(e.target.dataset.filter==="high") high=e.target.checked; else changed=e.target.checked;
  render();
});
document.addEventListener("click",e=>{
  const target=e.target.closest("[data-tenor],[data-alert],[data-source],[data-close],[data-retry]");
  if(!target) return;
  const d=target.dataset;
  if(d.tenor) openDrawer(d.tenor);
  else if(d.source!==undefined) source(universe[Number(d.source)]);
  else if(d.alert!==undefined){
    const r=universe[Number(d.alert)]; openDrawer(r.tenor);
    const card=$("r"+d.alert);
    if(card){card.scrollIntoView({block:"nearest"});card.querySelector("button")?.focus();}
    else source(r);
  }else if(d.close) $(d.close).close(); else load();
});
$("yieldChart").addEventListener("keydown",e=>{
  if(e.target.dataset.tenor && ["Enter"," "].includes(e.key)){e.preventDefault();openDrawer(e.target.dataset.tenor);}
});
for(const d of document.querySelectorAll("dialog")) d.addEventListener("click",e=>{
  if(e.target!==d)return;
  const box=d.getBoundingClientRect();
  if(e.clientX<box.left || e.clientX>box.right || e.clientY<box.top || e.clientY>box.bottom)d.close();
});
$("drawer").addEventListener("close",()=>{selectedTenor="";});
document.addEventListener("visibilitychange",()=>{if(!document.hidden && data)render();});
function endpoint(){
  const shared = new URLSearchParams(location.search).get("data");
  if(!shared && !DATA_URL.trim()) return null;
  const url = new URL(shared || DATA_URL,location.href);
  if(url.username || url.password || (url.origin!==location.origin && url.protocol!=="https:"))
    throw Error("数据源须为公开 HTTPS 地址");
  if(shared && (url.origin!=="https://raw.githubusercontent.com" || url.search || url.hash))
    throw Error("链接参数仅接受 GitHub 公开 Raw 地址");
  url.searchParams.set("t",Date.now());
  return url;
}
async function load(){
  const status=$("status");
  status.hidden=false; status.textContent="正在读取看板数据…";
  const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),8000);
  let fallback="";
  try{
    const url=endpoint();
    if(!url) throw Error("尚未配置数据地址");
    const response=await fetch(url,{cache:"no-store",credentials:"omit",referrerPolicy:"no-referrer",signal:controller.signal});
    if(!response.ok) throw Error("HTTP "+response.status);
    init(await response.json()); render();
  }catch(e){
    fallback=e.name==="AbortError"?"请求超时":e.message;
    init(JSON.parse($("embeddedSample").textContent)); render();
  }finally{clearTimeout(timer);}
  $("updatedAt").textContent=data.updated_at.replace("T"," ");
  $("mode").textContent=fallback?"内置演示":data.demo_mode?"模拟数据":"研报数据";
  $("mode").classList.toggle("live",!data.demo_mode && !fallback);
  status.hidden=!fallback;
  if(fallback) status.innerHTML="数据源读取失败（"+esc(fallback)+"），当前展示内置模拟数据。 <button data-retry>重试</button>";
  document.querySelectorAll("[data-filter]").forEach(e=>{e.disabled=false;});
  $("dashboard").hidden=false;
}
load();
</script></body></html>
